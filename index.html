<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>记账</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#f6f6f4; --card:#fff; --ink:#1c1c1e; --sub:#8a8a8e;
    --line:#e8e8e6; --accent:#0f766e; --accent-soft:#d9efec; --danger:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#111214; --card:#1c1d20; --ink:#f2f2f7; --sub:#8e8e93;
           --line:#2a2b30; --accent:#2dd4bf; --accent-soft:#123c3a; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif; }
  body{ padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  .wrap{ max-width:520px; margin:0 auto; }
  .card{ background:var(--card); border-radius:16px; padding:16px; margin-bottom:12px; }
  .sum{ display:flex; align-items:baseline; gap:8px; margin:2px 0 10px; }
  .sum b{ font-size:34px; font-weight:700; letter-spacing:-.5px; }
  .sum span{ color:var(--sub); font-size:14px; }
  .tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .tabs button{ flex:1; border:0; border-radius:10px; padding:9px 0; font-size:14px;
    background:var(--bg); color:var(--sub); }
  .tabs button[aria-selected="true"]{ background:var(--accent); color:#fff; }
  .amt{ display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); padding-bottom:10px; }
  .amt i{ font-style:normal; font-size:26px; color:var(--sub); }
  .amt input{ flex:1; border:0; background:transparent; color:var(--ink);
    font-size:30px; font-weight:600; outline:none; min-width:0; }
  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .chip{ border:1px solid var(--line); background:transparent; color:var(--ink);
    border-radius:999px; padding:8px 14px; font-size:14px; }
  .chip[aria-pressed="true"]{ background:var(--accent-soft); border-color:transparent; color:var(--accent); font-weight:600; }
  .row{ display:flex; gap:8px; }
  .row input[type=text], .row input[type=date]{ flex:1; min-width:0; border:0; background:var(--bg);
    color:var(--ink); border-radius:10px; padding:12px; font-size:15px; outline:none; }
  .add{ width:100%; border:0; border-radius:12px; padding:15px; margin-top:12px;
    background:var(--accent); color:#fff; font-size:17px; font-weight:600; }
  .add:active{ opacity:.85; }
  h2{ font-size:13px; color:var(--sub); font-weight:600; margin:0 0 10px; letter-spacing:.06em; }
  ul{ list-style:none; margin:0; padding:0; }
  li{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line); }
  li:first-child{ border-top:0; }
  li .d{ color:var(--sub); font-size:12px; width:52px; flex:none; }
  li .t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  li .t small{ color:var(--sub); font-size:12px; margin-left:6px; }
  li .v{ font-variant-numeric:tabular-nums; font-weight:600; }
  li .x{ border:0; background:transparent; color:var(--sub); font-size:18px; padding:6px 2px 6px 10px; }
  .bars{ display:grid; gap:9px; }
  .bar{ display:grid; grid-template-columns:64px 1fr 64px; align-items:center; gap:10px; font-size:14px; }
  .bar .bg{ display:block; height:8px; border-radius:4px; background:var(--line); overflow:hidden; }
  .bar .fg{ display:block; height:100%; background:var(--accent); border-radius:4px; }
  .bar .n{ text-align:right; font-variant-numeric:tabular-nums; color:var(--sub); }
  .empty{ color:var(--sub); font-size:14px; padding:8px 0; }
  .foot{ display:flex; gap:10px; justify-content:center; margin-top:6px; }
  .foot button{ border:0; background:transparent; color:var(--sub); font-size:13px; padding:8px; }
  .toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 26px);
    transform:translate(-50%,20px); background:#000c; color:#fff; padding:10px 18px;
    border-radius:999px; font-size:14px; opacity:0; transition:.25s; pointer-events:none; }
  .toast.on{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <h2 id="sumTitle">本月合计</h2>
    <div class="sum"><b id="sumVal">¥0.00</b><span id="sumSub"></span></div>
    <div class="tabs" role="tablist">
      <button role="tab" data-scope="week">本周</button>
      <button role="tab" data-scope="month" aria-selected="true">本月</button>
      <button role="tab" data-scope="all">全部</button>
    </div>
    <div class="bars" id="bars"></div>
  </div>

  <div class="card">
    <div class="amt"><i>¥</i>
      <input id="amount" inputmode="decimal" placeholder="0.00" autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <div class="row">
      <input type="text" id="note" placeholder="备注（可不填）" maxlength="40">
      <input type="date" id="date">
    </div>
    <button class="add" id="add">记一笔</button>
  </div>

  <div class="card">
    <h2>最近</h2>
    <ul id="list"></ul>
  </div>

  <div class="foot">
    <button id="export">导出备份</button>
    <button id="import">导入</button>
    <button id="clear">清空</button>
  </div>
  <input type="file" id="file" accept="application/json" hidden>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'ledger.v1';
const CATS = ['吃饭','交通','买菜','零食','日用','其他'];
const $ = id => document.getElementById(id);
let scope = 'month';

const todayStr = () => {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
};
const money = v => '¥' + v.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
// 存储适配：装成 App 时走原生桥（SharedPreferences），网页里用 localStorage
const IN_APP = typeof window.AndroidStore !== 'undefined';
const load = () => {
  try {
    if (IN_APP) { const s = AndroidStore.get('ledger'); return s ? JSON.parse(s) : []; }
    return JSON.parse(localStorage.getItem(KEY)) || [];
  } catch { return []; }
};
const save = rows => {
  const s = JSON.stringify(rows);
  if (IN_APP) { try { AndroidStore.set('ledger', s); return; } catch (e) {} }
  localStorage.setItem(KEY, s);
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

let rows = load();
let cat = '吃饭';

// 分类胶囊
$('chips').innerHTML = CATS.map(c =>
  `<button class="chip" data-cat="${c}" aria-pressed="${c === cat}">${c}</button>`).join('');
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  cat = b.dataset.cat;
  [...$('chips').children].forEach(x => x.setAttribute('aria-pressed', x === b));
});

// 日期默认今天，可切昨天
const dateEl = $('date');
dateEl.value = todayStr();

$('add').addEventListener('click', () => {
  const raw = $('amount').value.replace(/[¥￥元块,\s]/g, '');
  const v = Math.round(parseFloat(raw) * 100) / 100;
  if (!(v > 0)) { toast('金额填一下'); $('amount').focus(); return; }
  rows.push({ id: uid(), date: dateEl.value || todayStr(), amount: v, cat, note: $('note').value.trim() });
  save(rows);
  $('amount').value = ''; $('note').value = '';
  render();
  toast(`记好了 · ${money(v)}`);
  $('amount').focus();
});

$('list').addEventListener('click', e => {
  const b = e.target.closest('.x'); if (!b) return;
  const row = rows.find(r => r.id === b.dataset.id);
  if (!row) return;
  if (!confirm(`删掉这笔 ${money(row.amount)}？`)) return;
  rows = rows.filter(r => r.id !== row.id);
  save(rows); render(); toast('已删除');
});

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  scope = b.dataset.scope;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  render();
}));

function bounds() {
  const d = new Date(), p = n => String(n).padStart(2, '0');
  const day = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  if (scope === 'week') {
    const wd = (d.getDay() + 6) % 7;                 // 周一为 1
    const s = new Date(d); s.setDate(d.getDate() - wd);
    const e = new Date(s); e.setDate(s.getDate() + 6);
    return [`${s.getFullYear()}-${p(s.getMonth()+1)}-${p(s.getDate())}`,
            `${e.getFullYear()}-${p(e.getMonth()+1)}-${p(e.getDate())}`];
  }
  if (scope === 'month') return [day.slice(0, 8) + '01', day.slice(0, 8) + '31'];
  return ['0000-01-01', '9999-12-31'];
}
function inScope(r) { const [a, b] = bounds(); return r.date >= a && r.date <= b; }

function render() {
  const title = { week:'本周合计', month:'本月合计', all:'全部合计' }[scope];
  $('sumTitle').textContent = title;
  const cur = rows.filter(inScope);
  const total = cur.reduce((s, r) => s + r.amount, 0);
  $('sumVal').textContent = money(total);
  $('sumSub').textContent = cur.length ? `${cur.length} 笔` : '还没记';

  const by = {};
  cur.forEach(r => by[r.cat] = (by[r.cat] || 0) + r.amount);
  const items = Object.entries(by).sort((a, b) => b[1] - a[1]);
  $('bars').innerHTML = items.length ? items.map(([k, v]) => {
    const pct = total ? v / total * 100 : 0;
    return `<div class="bar"><span>${k}</span><span class="bg"><span class="fg"
      style="width:${pct.toFixed(1)}%"></span></span><span class="n">${money(v)}</span></div>`;
  }).join('') : '<div class="empty">记一笔就能看到分类占比</div>';

  const recent = rows.slice(-30).reverse();
  $('list').innerHTML = recent.length ? recent.map(r => {
    const d = r.date.slice(5).replace('-', '/');
    return `<li><span class="d">${d}</span><span class="t">${esc(r.cat)}${r.note ? `<small>${esc(r.note)}</small>` : ''}</span>
      <span class="v">${money(r.amount)}</span><button class="x" data-id="${r.id}" aria-label="删除">✕</button></li>`;
  }).join('') : '<li class="empty" style="border:0">还没有记录</li>';
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

let tid;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(tid); tid = setTimeout(() => t.classList.remove('on'), 1600);
}

$('export').addEventListener('click', () => {
  const json = JSON.stringify({ version: 1, rows }, null, 2);
  if (IN_APP) { AndroidStore.copy(json); toast('备份已复制到剪贴板'); return; }
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `记账备份-${todayStr()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('已导出');
});

function applyImport(text) {
  try {
    const data = JSON.parse(text);
    const add = (data.rows || data).filter(r => r && r.amount > 0).map(r => ({
      id: r.id || uid(), date: r.date, amount: Number(r.amount), cat: r.cat || r.category || '其他', note: r.note || ''
    }));
    if (!add.length) return toast('里面没有记录');
    if (!confirm(`导入 ${add.length} 笔？会追加到现有记录后面。`)) return;
    rows = rows.concat(add); save(rows); render(); toast(`导入 ${add.length} 笔`);
  } catch { toast('这段内容读不了'); }
}

$('import').addEventListener('click', () => {
  if (!IN_APP) return $('file').click();
  const text = prompt('粘贴备份 JSON：');
  if (text) applyImport(text);
});
$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  applyImport(await f.text());
  e.target.value = '';
});
$('clear').addEventListener('click', () => {
  if (!rows.length) return toast('已经是空的');
  if (!confirm(`清空全部 ${rows.length} 笔？清空前先导出备份。`)) return;
  rows = []; save(rows); render(); toast('已清空');
});

// 键盘回车直接记
$('amount').addEventListener('keydown', e => { if (e.key === 'Enter') $('add').click(); });
$('note').addEventListener('keydown', e => { if (e.key === 'Enter') $('add').click(); });

render();

// 离线缓存：装到主屏后，即使后台服务停了也能打开
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
